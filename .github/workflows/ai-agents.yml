name: AI Agents

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:hygiene
      - run: npm run build
      - run: npm run test:integration
      - run: npm run package
